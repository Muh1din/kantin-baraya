        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            let bg = 'bg-slate-800 text-white';
            let icon = 'info';
            if (type === 'success') { bg = 'bg-emerald-600 text-white'; icon = 'check-circle'; }
            if (type === 'error') { bg = 'bg-rose-600 text-white'; icon = 'alert-triangle'; }
            if (type === 'warning') { bg = 'bg-amber-600 text-white'; icon = 'alert-circle'; }

            toast.className = `p-3 rounded-lg shadow-lg flex items-center gap-3 text-xs font-medium pointer-events-auto transition-all transform translate-y-2 opacity-0 ${bg}`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4 shrink-0"></i> <span>${message}</span>`;

            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function addAuditLog(action, target) {
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0] + ' ' + now.toTimeString().split(' ')[0].substring(0, 5);
            state.auditLogs.unshift({
                id: Date.now(),
                date: dateStr,
                user: state.currentUser.name,
                action: action,
                target: target
            });
        }

        // Access Control (RBAC Definition)
        const RBAC = {
            customer: ['dashboard', 'catalog', 'cart', 'checkout', 'my-orders', 'tracking', 'profile'],
            cashier: ['dashboard-cashier', 'pos', 'verify-payment', 'pickup', 'transactions', 'orders-status'],
            admin: ['dashboard-admin', 'kitchen', 'inventory', 'inventory-transactions', 'recipes', 'suppliers', 'purchasing', 'products', 'categories'],
            owner: ['dashboard-admin', 'kitchen', 'inventory', 'inventory-transactions', 'recipes', 'suppliers', 'purchasing', 'products', 'categories', 'reports', 'users', 'audit']
        };

        function canAccess(page, role) {
            const allowedPages = RBAC[role] || [];
            return allowedPages.includes(page);
        }

        // ==========================================
        // 3. AUTH & ROLE SWITCHING
        // ==========================================
        function handleLogin(e) {
            e.preventDefault();
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            navigate('dashboard');
            showToast(`Selamat datang kembali, ${state.currentUser.name}!`, 'success');
        }

        function quickLogin(role) {
            state.currentRole = role;
            const foundUser = state.users.find(u => u.role === role) || { name: 'User ' + role, email: role + '@baraya.com' };
            state.currentUser = { ...foundUser, role: role };

            // Update UI Sidebar/Topbar Badges
            updateRoleUI();

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');

            // Route to initial page of role
            if (role === 'customer') navigate('dashboard');
            else if (role === 'cashier') navigate('dashboard-cashier');
            else navigate('dashboard-admin');

            showToast(`Login sebagai ${role.toUpperCase()} (${state.currentUser.name})`, 'info');
        }

        function switchRole(role) {
            quickLogin(role);
            closeModal();
        }

        function logout() {
            document.getElementById('app').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            showToast('Anda telah keluar dari sistem.', 'info');
        }

        function updateRoleUI() {
            document.getElementById('sidebar-role-badge').innerText = state.currentRole.toUpperCase();
            document.getElementById('topbar-role-badge').innerText = state.currentRole.toUpperCase();
            document.getElementById('sidebar-user-name').innerText = state.currentUser.name;
            document.getElementById('topbar-user-name').innerText = state.currentUser.name;

            renderSidebarMenu();
        }

        // ==========================================
        // 4. ROUTING & RENDERER ENGINE
        // ==========================================
        function navigate(pageId, params = {}) {
            if (!canAccess(pageId, state.currentRole)) {
                renderAccessDenied();
                return;
            }

            state.currentPage = pageId;
            const main = document.getElementById('main-content');

            // Update Breadcrumb
            document.getElementById('breadcrumb').innerHTML = `<span>App</span> <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-gray-400"></i> <span class="capitalize text-brand-navy font-bold">${pageId.replace('-', ' ')}</span>`;

            // Close mobile sidebar if open
            document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('sidebar-backdrop').classList.add('hidden');

            // Page Render Routing
            switch (pageId) {
                case 'dashboard': renderCustomerDashboard(); break;
                case 'catalog': renderCatalog(); break;
                case 'cart': renderCartPage(); break;
                case 'checkout': renderCheckoutPage(); break;
                case 'my-orders': renderMyOrdersPage(); break;
                case 'tracking': renderOrderTrackingPage(params.orderId); break;

                // Cashier Pages
                case 'dashboard-cashier': renderCashierDashboard(); break;
                case 'pos': renderPOSPage(); break;
                case 'verify-payment': renderVerifyPaymentPage(); break;
                case 'pickup': renderPickupPage(); break;

                // Admin & Owner Pages
                case 'dashboard-admin': renderAdminDashboard(); break;
                case 'kitchen': renderKitchenDisplay(); break;
                case 'inventory': renderInventoryPage(); break;
                case 'inventory-transactions': renderInventoryTransactionsPage(); break;
                case 'recipes': renderRecipesPage(); break;
                case 'suppliers': renderSuppliersPage(); break;
                case 'purchasing': renderPurchasingPage(); break;
                case 'products': renderProductsMasterPage(); break;
                case 'reports': renderReportsPage(); break;
                case 'users': renderUsersPage(); break;
                case 'audit': renderAuditLogPage(); break;

                default:
                    main.innerHTML = `<div class="p-8 text-center text-gray-500">Halaman (${pageId}) sedang dalam pengembangan.</div>`;
            }

            lucide.createIcons();
            updateNotifications();
        }

        function renderAccessDenied() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="bg-white rounded-lg p-12 text-center shadow-sm max-w-lg mx-auto my-12 border border-red-200">
                    <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i data-lucide="shield-alert" class="w-8 h-8"></i>
                    </div>
                    <h2 class="text-xl font-bold text-gray-800 mb-2">Akses Ditolak</h2>
                    <p class="text-sm text-gray-600 mb-6">Role <strong>${state.currentRole.toUpperCase()}</strong> Anda tidak memiliki izin untuk membuka halaman ini.</p>
                    <button onclick="navigateDefault()" class="px-4 py-2 bg-brand-navy text-white text-xs font-semibold rounded hover:bg-slate-800">
                        Kembali ke Dashboard Utama
                    </button>
                </div>
            `;
            lucide.createIcons();
        }

        function navigateDefault() {
            if (state.currentRole === 'customer') navigate('dashboard');
            else if (state.currentRole === 'cashier') navigate('dashboard-cashier');
            else navigate('dashboard-admin');
        }

        // ==========================================
        // 5. SIDEBAR MENU BUILDER BY ROLE
        // ==========================================
        function renderSidebarMenu() {
            const menuContainer = document.getElementById('sidebar-menu');
            let links = [];

            if (state.currentRole === 'customer') {
                links = [
                    { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                    { id: 'catalog', label: 'Katalog Menu', icon: 'utensils' },
                    { id: 'cart', label: 'Keranjang', icon: 'shopping-cart', badge: state.cart.length ? state.cart.length : null },
                    { id: 'my-orders', label: 'Pesanan Saya', icon: 'receipt' },
                ];
            } else if (state.currentRole === 'cashier') {
                links = [
                    { id: 'dashboard-cashier', label: 'Dashboard Kasir', icon: 'layout-dashboard' },
                    { id: 'pos', label: 'POS (Mesin Kasir)', icon: 'calculator' },
                    { id: 'verify-payment', label: 'Verifikasi Bayar', icon: 'check-square' },
                    { id: 'pickup', label: 'Pickup Pre-Order', icon: 'package-check' }
                ];
            } else if (state.currentRole === 'admin' || state.currentRole === 'owner') {
                links = [
                    { id: 'dashboard-admin', label: 'Overview', icon: 'bar-chart-3' },
                    { id: 'kitchen', label: 'Kitchen Display', icon: 'chef-hat' },
                    { id: 'inventory', label: 'Stok Inventori', icon: 'boxes' },
                    { id: 'inventory-transactions', label: 'Mutasi Stok', icon: 'history' },
                    { id: 'recipes', label: 'Resep / BOM', icon: 'book-open' },
                    { id: 'suppliers', label: 'Data Supplier', icon: 'truck' },
                    { id: 'purchasing', label: 'Purchasing (PO)', icon: 'shopping-bag' },
                    { id: 'products', label: 'Master Produk', icon: 'utensils-crossed' }
                ];

                if (state.currentRole === 'owner') {
                    links.push(
                        { id: 'reports', label: 'Laporan Keuangan', icon: 'file-spreadsheet' },
                        { id: 'users', label: 'User Management', icon: 'users' },
                        { id: 'audit', label: 'Audit Log', icon: 'file-text' }
                    );
                }
            }

            menuContainer.innerHTML = links.map(link => `
                <button onclick="navigate('${link.id}')" class="w-full text-left px-3 py-2 rounded text-xs font-medium transition flex items-center justify-between ${state.currentPage === link.id ? 'bg-brand-gold text-slate-900 font-bold' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}">
                    <div class="flex items-center gap-2.5">
                        <i data-lucide="${link.icon}" class="w-4 h-4"></i>
                        <span>${link.label}</span>
                    </div>
                    ${link.badge ? `<span class="bg-red-500 text-white text-[10px] px-1.5 py-0.2 rounded-full font-bold">${link.badge}</span>` : ''}
                </button>
            `).join('');

            lucide.createIcons();
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            sidebar.classList.toggle('-translate-x-full');
            backdrop.classList.toggle('hidden');
        }

        // ==========================================
        // 6. PAGE RENDERERS: CUSTOMER
        // ==========================================
        function renderCustomerDashboard() {
            const activeOrders = state.orders.filter(o => o.customerName === state.currentUser.name && o.orderStatus !== 'COMPLETED' && o.orderStatus !== 'CANCELED');
            const completedOrders = state.orders.filter(o => o.customerName === state.currentUser.name && o.orderStatus === 'COMPLETED');

            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-white p-5 rounded-lg border border-brand-border flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h1 class="text-xl font-bold text-brand-navy">Selamat datang, ${state.currentUser.name} 👋</h1>
                            <p class="text-xs text-gray-500 mt-1">Pesan makanan favoritmu dari Kantin Baraya secara pre-order tanpa antre!</p>
                        </div>
                        <button onclick="navigate('catalog')" class="px-4 py-2 bg-brand-gold text-slate-900 hover:bg-yellow-600 font-bold text-xs rounded shadow flex items-center gap-2">
                            <i data-lucide="utensils" class="w-4 h-4"></i> Pesan Sekarang
                        </button>
                    </div>

                    <!-- Metric Cards -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div class="bg-white p-4 rounded-lg border border-brand-border">
                            <span class="text-xs text-gray-500 font-medium">Pesanan Aktif</span>
                            <div class="text-2xl font-bold text-brand-navy mt-1">${activeOrders.length}</div>
                        </div>
                        <div class="bg-white p-4 rounded-lg border border-brand-border">
                            <span class="text-xs text-gray-500 font-medium">Pesanan Selesai</span>
                            <div class="text-2xl font-bold text-brand-navy mt-1">${completedOrders.length}</div>
                        </div>
                        <div class="bg-white p-4 rounded-lg border border-brand-border">
                            <span class="text-xs text-gray-500 font-medium">Total Pesanan</span>
                            <div class="text-2xl font-bold text-brand-navy mt-1">${state.orders.filter(o => o.customerName === state.currentUser.name).length}</div>
                        </div>
                    </div>

                    <!-- Active Order Highlight Section -->
                    <div class="bg-white rounded-lg border border-brand-border p-5">
                        <h2 class="text-sm font-bold text-brand-navy mb-4 flex items-center gap-2">
                            <i data-lucide="clock" class="w-4 h-4 text-brand-gold"></i> Status Pesanan Aktif
                        </h2>
                        ${activeOrders.length === 0 ? `
                            <div class="text-center py-6 text-gray-400 text-xs">

                                Tidak ada pesanan aktif saat ini.
                            </div>
                        ` : activeOrders.map(ord => renderCustomerOrderTimelineCard(ord)).join('')}
                    </div>

                    <!-- Favorite Items Carousel / Cards -->
                    <div>
                        <h2 class="text-sm font-bold text-brand-navy mb-3">Menu Favorit Hari Ini</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                            ${state.products.slice(0, 4).map(p => renderProductCardHTML(p)).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCustomerOrderTimelineCard(ord) {
            const steps = [
                { key: 'PENDING_PAYMENT', label: 'Pesanan Dibayar' },
                { key: 'PAID', label: 'Menunggu Produksi' },
                { key: 'IN_PRODUCTION', label: 'Sedang Diproduksi' },
                { key: 'READY_FOR_PICKUP', label: 'Siap Diambil' },
                { key: 'COMPLETED', label: 'Selesai' }
            ];

            const statusIndex = {
                'PENDING_PAYMENT': 0,
                'PAID': 1,
                'IN_PRODUCTION': 2,
                'READY_FOR_PICKUP': 3,
                'COMPLETED': 4,
                'CANCELED': -1
            }[ord.orderStatus];

            return `
                <div class="border border-slate-200 rounded p-4 mb-3 bg-slate-50">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="font-bold text-xs text-brand-navy">${ord.id}</span>
                            <div class="text-[11px] text-gray-500">Estimasi Pickup: ${ord.pickupTime} WIB</div>
                        </div>
                        <div class="text-right">
                            <span class="font-bold text-xs text-brand-navy">${formatCurrency(ord.total)}</span>
                            <div class="text-[10px] text-brand-steel uppercase font-bold">${ord.paymentMethod}</div>
                        </div>
                    </div>

                    <!-- Timeline Progress -->
                    <div class="my-4">
                        <div class="flex items-center justify-between relative">
                            <div class="absolute left-0 right-0 top-1/2 h-0.5 bg-gray-200 -z-0"></div>
                            ${steps.map((s, idx) => {
                let iconHTML = `<div class="w-6 h-6 rounded-full border-2 border-gray-300 bg-white text-gray-400 flex items-center justify-center text-[10px] font-bold z-10">${idx + 1}</div>`;
                if (idx < statusIndex) {
                    iconHTML = `<div class="w-6 h-6 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs z-10">✓</div>`;
                } else if (idx === statusIndex) {
                    iconHTML = `<div class="w-6 h-6 rounded-full bg-brand-gold text-slate-900 font-bold flex items-center justify-center text-xs z-10 animate-pulse">●</div>`;
                }
                return `
                                    <div class="flex flex-col items-center text-center">
                                        ${iconHTML}
                                        <span class="text-[9px] mt-1 font-medium ${idx <= statusIndex ? 'text-brand-navy font-bold' : 'text-gray-400'}">${s.label}</span>
                                    </div>
                                `;
            }).join('')}
                        </div>
                    </div>

                    <div class="pt-2 border-t border-gray-200 flex justify-end">
                        <button onclick="navigate('tracking', {orderId: '${ord.id}'})" class="text-xs px-3 py-1 bg-brand-navy text-white rounded hover:bg-slate-800">Lihat Detail & Tracking</button>
                    </div>
                </div>
            `;
        }

        function renderCatalog() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="space-y-4">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div>
                            <h1 class="text-lg font-bold text-brand-navy">Katalog Menu Kantin</h1>
                            <p class="text-xs text-gray-500">Pilih hidangan lezat dan tambahkan catatan sesuai selera.</p>
                        </div>
                        <!-- Search & Filter -->
                        <div class="flex items-center gap-2 w-full sm:w-auto">
                            <input type="text" id="catalog-search" oninput="filterCatalog()" placeholder="Cari menu..." class="px-3 py-1.5 border rounded text-xs w-full sm:w-48">
                        </div>
                    </div>

                    <!-- Category Pills -->
                    <div class="flex gap-2 border-b pb-2 text-xs font-medium">
                        <button onclick="filterCatalogCategory('Semua')" class="cat-pill active px-3 py-1 bg-brand-navy text-white rounded-full">Semua</button>
                        <button onclick="filterCatalogCategory('Makanan')" class="cat-pill px-3 py-1 bg-slate-200 text-slate-700 rounded-full">Makanan</button>
                        <button onclick="filterCatalogCategory('Minuman')" class="cat-pill px-3 py-1 bg-slate-200 text-slate-700 rounded-full">Minuman</button>
                        <button onclick="filterCatalogCategory('Snack')" class="cat-pill px-3 py-1 bg-slate-200 text-slate-700 rounded-full">Snack</button>
                    </div>

                    <!-- Grid Products -->
                    <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                        ${state.products.map(p => renderProductCardHTML(p)).join('')}
                    </div>
                </div>
            `;
        }

        let selectedCategoryFilter = 'Semua';

        function filterCatalogCategory(cat) {
            selectedCategoryFilter = cat;
            document.querySelectorAll('.cat-pill').forEach(btn => {
                btn.classList.remove('bg-brand-navy', 'text-white');
                btn.classList.add('bg-slate-200', 'text-slate-700');
                if (btn.innerText === cat) {
                    btn.classList.add('bg-brand-navy', 'text-white');
                    btn.classList.remove('bg-slate-200', 'text-slate-700');
                }
            });
            filterCatalog();
        }

        function filterCatalog() {
            const query = document.getElementById('catalog-search')?.value.toLowerCase() || '';
            const filtered = state.products.filter(p => {
                const matchesCat = selectedCategoryFilter === 'Semua' || p.category === selectedCategoryFilter;
                const matchesSearch = p.name.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });

            const grid = document.getElementById('catalog-grid');
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-gray-400 text-xs">Menu tidak ditemukan.</div>`;
            } else {
                grid.innerHTML = filtered.map(p => renderProductCardHTML(p)).join('');
            }
            lucide.createIcons();
        }

        function renderProductCardHTML(product) {
            return `
                <div class="bg-white border border-brand-border rounded-lg overflow-hidden flex flex-col justify-between hover:shadow-md transition">
                    <div>
                        <div class="h-32 w-full bg-slate-100 relative overflow-hidden">
                            <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover">
                            <span class="absolute top-2 left-2 text-[10px] font-bold px-2 py-0.5 rounded ${product.available ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}">
                                ${product.available ? 'Tersedia' : 'Habis'}
                            </span>
                        </div>
                        <div class="p-3">
                            <span class="text-[10px] text-gray-400 uppercase font-semibold">${product.category}</span>
                            <h3 class="font-bold text-sm text-brand-navy leading-snug line-clamp-1">${product.name}</h3>
                            <p class="text-xs text-gray-500 mt-1 line-clamp-2">${product.desc}</p>
                        </div>
                    </div>
                    <div class="p-3 pt-0 flex items-center justify-between mt-2">
                        <span class="font-bold text-xs text-brand-navy">${formatCurrency(product.price)}</span>
                        <button onclick="openProductDetailModal('${product.id}')" ${!product.available ? 'disabled' : ''} class="px-3 py-1.5 text-xs font-semibold rounded bg-brand-navy hover:bg-slate-800 text-white disabled:bg-gray-300 disabled:cursor-not-allowed flex items-center gap-1">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah
                        </button>
                    </div>
                </div>
            `;
        }

        // Product Detail Modal
        function openProductDetailModal(productId) {
            const product = state.products.find(p => p.id === productId);
            if (!product) return;

            const modalBody = `
                <div class="space-y-4">
                    <img src="${product.image}" class="w-full h-40 object-cover rounded">
                    <div>
                        <div class="flex justify-between items-center">
                            <h2 class="font-bold text-base text-brand-navy">${product.name}</h2>
                            <span class="font-bold text-sm text-brand-gold">${formatCurrency(product.price)}</span>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">${product.desc}</p>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Jumlah / Quantity</label>
                        <div class="flex items-center gap-3">
                            <button onclick="changeModalQty(-1)" class="w-8 h-8 bg-slate-200 font-bold rounded flex items-center justify-center">-</button>
                            <span id="modal-item-qty" class="font-bold text-sm">1</span>
                            <button onclick="changeModalQty(1)" class="w-8 h-8 bg-slate-200 font-bold rounded flex items-center justify-center">+</button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Catatan Item (Item Notes)</label>
                        <textarea id="modal-item-notes" placeholder="Contoh: tidak pedas, telur dipisah, es sedikit..." class="w-full text-xs p-2 border rounded focus:outline-none focus:border-brand-steel" rows="2"></textarea>
                    </div>
                </div>
            `;

            const modalFooter = `
                <button onclick="closeModal()" class="px-3 py-1.5 border rounded text-xs text-gray-600">Batal</button>
                <button onclick="addToCartFromModal('${product.id}')" class="px-4 py-1.5 bg-brand-gold text-slate-900 font-bold rounded text-xs hover:bg-yellow-600">
                    Tambah ke Keranjang
                </button>
            `;

            openCustomModal('Detail Produk', modalBody, modalFooter);
        }

        let tempModalQty = 1;
        function changeModalQty(delta) {
            tempModalQty = Math.max(1, tempModalQty + delta);
            document.getElementById('modal-item-qty').innerText = tempModalQty;
        }

        function addToCartFromModal(productId) {
            const product = state.products.find(p => p.id === productId);
            const notes = document.getElementById('modal-item-notes')?.value || '';

            const existingIndex = state.cart.findIndex(c => c.productId === productId && c.notes === notes);
            if (existingIndex > -1) {
                state.cart[existingIndex].qty += tempModalQty;
            } else {
                state.cart.push({
                    productId: product.id,
                    name: product.name,
                    price: product.price,
                    qty: tempModalQty,
                    notes: notes
                });
            }

            tempModalQty = 1;
            closeModal();
            showToast(`${product.name} ditambahkan ke keranjang!`, 'success');
            renderSidebarMenu(); // update badge
        }

        function renderCartPage() {
            const subtotal = state.cart.reduce((acc, item) => acc + (item.price * item.qty), 0);

            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="max-w-2xl mx-auto space-y-4">
                    <h1 class="text-lg font-bold text-brand-navy">Keranjang Belanja</h1>

                    ${state.cart.length === 0 ? `
                        <div class="bg-white p-8 rounded border border-brand-border text-center">
                            <i data-lucide="shopping-cart" class="w-12 h-12 text-gray-300 mx-auto mb-2"></i>
                            <p class="text-xs text-gray-500 mb-4">Keranjang belanja Anda masih kosong.</p>
                            <button onclick="navigate('catalog')" class="px-4 py-2 bg-brand-navy text-white text-xs rounded">Buka Katalog Menu</button>

        let selectedPOSCat = 'Semua';
        function filterPOSCat(cat) {
            selectedPOSCat = cat;

        function filterPOSProducts() {
            const query = document.getElementById('pos-search')?.value.toLowerCase() || '';
            const filtered = state.products.filter(p => {
                const matchCat = selectedPOSCat === 'Semua' || p.category === selectedPOSCat;
                const matchQ = p.name.toLowerCase().includes(query);
                return matchCat && matchQ;
            });

            const grid = document.getElementById('pos-grid');
            grid.innerHTML = filtered.map(p => `
                <div onclick="addToPOSCart('${p.id}')" class="border rounded p-2.5 flex flex-col justify-between cursor-pointer hover:border-brand-gold hover:shadow-sm transition bg-white ${!p.available ? 'opacity-50 pointer-events-none' : ''}">

                    <div class="mt-2 font-bold text-xs text-brand-navy">${formatCurrency(p.price)}</div>
                </div>
            `).join('');
        }

        function addToPOSCart(productId) {
            const prod = state.products.find(p => p.id === productId);
            const idx = posCart.findIndex(i => i.productId === productId);
            if (idx > -1) {
                posCart[idx].qty += 1;
            } else {
                posCart.push({ productId: prod.id, name: prod.name, price: prod.price, qty: 1, notes: '' });
            }
            renderPOSCartItems();
        }

        function renderPOSCartItems() {
            const container = document.getElementById('pos-cart-items');
            if (!container) return;

            if (posCart.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-xs text-gray-400">Belum ada produk dipilih.</div>`;
            } else {
                container.innerHTML = posCart.map((item, idx) => `
                    <div class="pt-2 text-xs flex justify-between items-center">
                        <div>
                            <div class="font-bold text-brand-navy">${item.name}</div>
                            <span class="text-[10px] text-gray-500">${formatCurrency(item.price)} x ${item.qty}</span>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="posCart[${idx}].qty--; if(posCart[${idx}].qty<=0) posCart.splice(${idx},1); renderPOSCartItems();" class="w-5 h-5 border rounded flex items-center justify-center font-bold text-xs">-</button>
                            <span class="text-xs font-bold w-4 text-center">${item.qty}</span>
                            <button onclick="posCart[${idx}].qty++; renderPOSCartItems();" class="w-5 h-5 border rounded flex items-center justify-center font-bold text-xs">+</button>
                        </div>
                    </div>
                `).join('');
            }

            const total = posCart.reduce((acc, i) => acc + (i.price * i.qty), 0);
            document.getElementById('pos-subtotal').innerText = formatCurrency(total);
            calculatePOSChange();
        }

        function togglePOSCashInput() {
            const method = document.getElementById('pos-pay-method').value;
            const cashBox = document.getElementById('pos-cash-container');
            if (method === 'QRIS') cashBox.classList.add('hidden');
            else cashBox.classList.remove('hidden');
        }

        function calculatePOSChange() {
            const total = posCart.reduce((acc, i) => acc + (i.price * i.qty), 0);
            const cashInput = parseFloat(document.getElementById('pos-cash-input')?.value || 0);
            const change = cashInput - total;
            const changeElem = document.getElementById('pos-change');
            if (changeElem) {
                changeElem.innerText = formatCurrency(Math.max(0, change));
                if (change < 0) changeElem.classList.add('text-red-600');
                else changeElem.classList.remove('text-red-600');
            }
        }

        function processPOSTransaction() {
            if (posCart.length === 0) {
                showToast('Keranjang POS kosong!', 'error');
                return;
            }

            const total = posCart.reduce((acc, i) => acc + (i.price * i.qty), 0);
            const method = document.getElementById('pos-pay-method').value;
            let cashVal = total;
            let changeVal = 0;

            if (method === 'Tunai') {
                cashVal = parseFloat(document.getElementById('pos-cash-input')?.value || 0);
                if (cashVal < total) {
                    showToast('Uang diterima kurang dari total pembayaran!', 'error');
                    return;
                }
                changeVal = cashVal - total;
            }

            const posCode = 'POS-20260923-' + Math.floor(1000 + Math.random() * 9000);
            const newOrder = {
                id: posCode,
                customerName: 'Pelanggan Walk-In',
                items: [...posCart],
                total: total,
                paymentMethod: method,
                paymentStatus: 'PAID',
                orderStatus: 'READY_FOR_PICKUP',
                pickupTime: new Date().toTimeString().substring(0, 5),
                pickupDate: '2026-09-23',
                createdAt: '2026-09-23 ' + new Date().toTimeString().substring(0, 5),
                paidAt: new Date().toTimeString().substring(0, 5),
                cashReceived: cashVal,
                cashChange: changeVal
            };

            state.orders.unshift(newOrder);
            addAuditLog('Completed POS Transaction', posCode);

            // Open Receipt Modal
            openReceiptModal(newOrder);

            posCart = [];
            renderPOSCartItems();
        }

            const ord = state.orders.find(o => o.id === orderId);
            if (!ord) return;

            // Check BOM Stok Inventory Logic
            let insufficient = [];
            ord.items.forEach(item => {
                const bom = state.recipes[item.productId] || [];
                bom.forEach(b => {
                    const ing = state.ingredients.find(i => i.id === b.ingredientId);
                    const needed = b.qty * item.qty;
                    if (ing && ing.stock < needed) {
                        insufficient.push(`${ing.name} (Tersedia: ${ing.stock} ${ing.unit}, Dibutuhkan: ${needed} ${ing.unit})`);
                    }
                });
            });

            if (insufficient.length > 0) {
                const modalBody = `
                    <div class="space-y-2 text-xs text-red-700 bg-red-50 p-3 rounded border border-red-200">
                        <strong>STOK TIDAK MENCUKUPI!</strong>
                        <p>Produksi tidak dapat dimulai karena kekurangan stok:</p>
                        <ul class="list-disc pl-4 space-y-1">
                            ${insufficient.map(i => `<li>${i}</li>`).join('')}
                        </ul>
                    </div>
                `;
                openCustomModal('Peringatan Stok', modalBody, `<button onclick="closeModal()" class="px-3 py-1.5 border text-xs">Tutup</button>`);
                return;
            }

            // Deduct Stock
            ord.items.forEach(item => {
                const bom = state.recipes[item.productId] || [];
                bom.forEach(b => {
                    const ing = state.ingredients.find(i => i.id === b.ingredientId);
                    if (ing) {
                        ing.stock -= (b.qty * item.qty);
                        state.inventoryTransactions.unshift({
                            id: Date.now(),
                            date: '2026-09-23 ' + new Date().toTimeString().substring(0, 5),
                            ingredientName: ing.name,
                            type: 'OUT',
                            qty: -(b.qty * item.qty),
                            unit: ing.unit,
                            source: `Produksi ${ord.id}`,
                            user: state.currentUser.name
                        });
                    }
                });
            });

            ord.orderStatus = 'IN_PRODUCTION';
            ord.startedProductionAt = new Date().toTimeString().substring(0, 5);
            addAuditLog('Started Production', orderId);
            showToast(`Produksi ${orderId} dimulai & stok berkurang!`, 'success');
            navigate('kitchen');
        }

                ord.completedProductionAt = new Date().toTimeString().substring(0, 5);
                addAuditLog('Finished Production', orderId);

            }
            navigate('kitchen');

        function exportReportCSV() {
            let csvContent = "data:text/csv;charset=utf-8,Tanggal,OrderCode,Customer,Metode,Total\n";
            state.orders.forEach(o => {
                csvContent += `${o.createdAt},${o.id},${o.customerName},${o.paymentMethod},${o.total}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Laporan_Penjualan_KantinBaraya.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showToast('Laporan CSV berhasil diunduh!', 'success');
        }

        // ==========================================
        // 9. MODAL & TOAST REUSABLE CONTROLLER
        // ==========================================
        function openCustomModal(title, bodyHTML, footerHTML) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = bodyHTML;
            document.getElementById('modal-footer').innerHTML = footerHTML;
            document.getElementById('global-modal-overlay').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('global-modal-overlay').classList.add('hidden');
        }

        function openModal(type) {
            if (type === 'modal-switch-role') {
                const bodyHTML = `
                    <div class="grid grid-cols-2 gap-3 text-xs">
                        <button onclick="switchRole('customer')" class="p-3 border rounded hover:border-brand-gold text-left">
                            <strong class="text-brand-navy block">Pelanggan (Andi)</strong>
                            <span class="text-[10px] text-gray-500">Akses katalog & tracking</span>
                        </button>
                        <button onclick="switchRole('cashier')" class="p-3 border rounded hover:border-brand-gold text-left">
                            <strong class="text-brand-navy block">Kasir (Siti)</strong>
                            <span class="text-[10px] text-gray-500">POS & verifikasi bayar</span>
                        </button>
                        <button onclick="switchRole('admin')" class="p-3 border rounded hover:border-brand-gold text-left">
                            <strong class="text-brand-navy block">Admin (Budi)</strong>
                            <span class="text-[10px] text-gray-500">Produksi & stok bahan</span>
                        </button>
                        <button onclick="switchRole('owner')" class="p-3 border rounded hover:border-brand-gold text-left">
                            <strong class="text-brand-navy block">Owner (Dewi)</strong>
                            <span class="text-[10px] text-gray-500">Laporan & Audit log</span>
                        </button>
                    </div>
                `;
                openCustomModal('Switch Simulation Role', bodyHTML, `<button onclick="closeModal()" class="px-3 py-1.5 border text-xs">Tutup</button>`);
            }
        }

        function toggleNotificationDropdown() {
            document.getElementById('notif-dropdown').classList.toggle('hidden');
        }

        function updateNotifications() {
            const list = document.getElementById('notif-list');
            if (!list) return;

            const notifs = [
                { icon: 'alert-triangle', text: '6 bahan berada di bawah stok minimum.', color: 'text-red-500' },
                { icon: 'clock', text: '8 pre-order menunggu verifikasi.', color: 'text-amber-500' },
                { icon: 'check-circle', text: '3 order siap diambil.', color: 'text-emerald-500' }
            ];

            list.innerHTML = notifs.map(n => `
                <div class="flex items-start gap-2 p-1.5 hover:bg-slate-50 rounded">
                    <i data-lucide="${n.icon}" class="w-4 h-4 ${n.color} shrink-0 mt-0.5"></i>
                    <span>${n.text}</span>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // Initialize App icons
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
