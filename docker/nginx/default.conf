# TAHAP 2: pakai file ini SETELAH sertifikat Let's Encrypt terbit.
# Simpan sebagai docker/nginx/default.conf (timpa versi HTTP-only).

# HTTP: hanya untuk validasi certbot dan redirect ke HTTPS
server {
    listen 80 default_server;
    server_name kantin-baraya.web.id www.kantin-baraya.web.id _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kantin-baraya.web.id$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name kantin-baraya.web.id www.kantin-baraya.web.id;

    ssl_certificate     /etc/letsencrypt/live/kantin-baraya.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kantin-baraya.web.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Aktifkan setelah HTTPS terbukti stabil beberapa hari:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/html/public;
    index index.php index.html;

    server_tokens off;

    access_log off;
    error_log /var/log/nginx/error.log crit;

    client_max_body_size 10M;

    fastcgi_buffers 8 8k;
    fastcgi_buffer_size 16k;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage/ {
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}