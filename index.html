        // Format Currency Helper
        function formatIDR(amount) {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                maximumFractionDigits: 0
            }).format(amount);
        }

        // Add Audit Log Entry Helper
        function logAudit(action, module, obj, desc) {
            const now = new Date();
            const dateStr = `${now.getDate()} Sep ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            auditLogs.unshift({
                id: auditLogs.length + 1,
                timestamp: dateStr,
                user: state.currentUser ? state.currentUser.name : "System",
                action: action,
                module: module,
                obj: obj,
                desc: desc
            });
        }

        // ==========================================
        // 2. TOAST & MODAL ENGINE
        // ==========================================

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            let bg = 'bg-emerald-600 text-white';
            let icon = 'check-circle';
            if (type === 'warning') { bg = 'bg-amber-500 text-white'; icon = 'alert-triangle'; }
            if (type === 'danger') { bg = 'bg-rose-600 text-white'; icon = 'x-circle'; }
            if (type === 'info') { bg = 'bg-blue-600 text-white'; icon = 'info'; }

            toast.className = `flex items-center gap-3 p-4 rounded-xl shadow-lg ${bg} transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto`;
            toast.innerHTML = `
                <i data-lucide="${icon}" class="w-5 h-5 flex-shrink-0"></i>
                <span class="text-sm font-medium">${message}</span>
            `;

            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function showModal(htmlContent) {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');

            content.innerHTML = htmlContent;
            container.classList.remove('hidden');

            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);

            lucide.createIcons();

            // Backdrop click to close
            container.onclick = (e) => {
                if (e.target === container) closeModal();
            };
        }

        function closeModal() {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');

            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');

            setTimeout(() => {
                container.classList.add('hidden');
            }, 200);
        }

        // ==========================================
        // 3. AUTH & RBAC ROUTE PROTECTION
        // ==========================================

        function loginAs(role) {
            state.currentRole = role;
            if (role === ROLES.CUSTOMER) {
                state.currentUser = { name: "Andi Pratama", email: "andi@gmail.com", role: role };
                state.currentPage = 'customer-catalog';
            } else if (role === ROLES.CASHIER) {
                state.currentUser = { name: "Siti Kasir", email: "siti@kantinbaraya.com", role: role };
                state.currentPage = 'pos';
            } else if (role === ROLES.ADMIN) {
                state.currentUser = { name: "Budi Admin", email: "budi@kantinbaraya.com", role: role };
                state.currentPage = 'admin-dashboard';
            } else if (role === ROLES.OWNER) {
                state.currentUser = { name: "Hendra Owner", email: "owner@kantinbaraya.com", role: role };
                state.currentPage = 'admin-dashboard';
            }

            showToast(`Login berhasil sebagai ${role}`, 'success');
            render();
        }

        function logout() {
            state.currentUser = null;
            state.currentRole = null;
            state.currentPage = 'login';
            showToast("Berhasil keluar", 'info');
            render();
        }

        function hasPermission(page) {
            const role = state.currentRole;
            if (!role) return false;

            // Customer Pages
            const customerPages = ['customer-catalog', 'customer-cart', 'customer-checkout', 'customer-tracking', 'customer-history'];
            if (customerPages.includes(page) && role === ROLES.CUSTOMER) return true;

            // Cashier Pages
            const cashierPages = ['cashier-dashboard', 'pos', 'payment-verification', 'pickup-manager', 'customer-history'];
            if (cashierPages.includes(page) && role === ROLES.CASHIER) return true;

            // Admin & Owner Pages
            const adminOwnerPages = [
                'admin-dashboard', 'pos', 'payment-verification', 'pickup-manager',
                'kds', 'inventory', 'stock-movement', 'recipes',
                'suppliers', 'purchasing', 'products', 'categories',
                'users', 'reports', 'audit-log'
            ];
            if (adminOwnerPages.includes(page) && (role === ROLES.ADMIN || role === ROLES.OWNER)) return true;

            return false;
        }

        function navigateTo(page) {
            if (!state.currentUser && page !== 'login') {
                state.currentPage = 'login';
                render();
                return;
            }

            if (page !== 'login' && !hasPermission(page)) {
                showToast("Akses Ditolak: Anda tidak memiliki izin!", 'danger');
                return;
            }

            state.currentPage = page;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();
        }

                        </div>

                        <div>

                            <input type="text" id="modal-notes" placeholder="Contoh: Tidak pedas, sambal dipisah..." class="w-full px-3 py-2 border border-stone-200 rounded-xl text-xs focus:outline-none focus:border-brand-500">
                        </div>
                    </div>

                        Tambah ke Keranjang
                    </button>
                </div>
            `);
        }

        let tempModalQty = 1;
        function adjustModalQty(delta) {
            tempModalQty = Math.max(1, tempModalQty + delta);
            const el = document.getElementById('modal-qty');
            if (el) el.innerText = tempModalQty;
        }

        function addToCartFromModal(productId) {
            const product = products.find(p => p.id === productId);
            const notes = document.getElementById('modal-notes')?.value || '';
            const qty = tempModalQty;

            const existingIndex = state.cart.findIndex(c => c.productId === productId && c.notes === notes);
            if (existingIndex > -1) {
                state.cart[existingIndex].qty += qty;
            } else {
                state.cart.push({
                    productId: product.id,
                    name: product.name,
                    price: product.price,
                    qty: qty,
                    notes: notes
                });
            }

            tempModalQty = 1;
            closeModal();
            showToast(`${product.name} dimasukkan ke keranjang`, 'success');
            render();
        }

        function confirmCheckoutOrder() {

            const total = state.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            const orderId = `KB-${new Date().toISOString().slice(2, 10).replace(/-/g, '')}-${String(orders.length + 1).padStart(3, '0')}`;

            const newOrder = {
                id: orderId,
                customerName: state.currentUser.name,

                paymentMethod: payMethod,
                paymentStatus: payMethod === 'Tunai' ? 'UNPAID' : 'WAITING_VERIFICATION',

                date: new Date().toLocaleString('id-ID'),
                items: [...state.cart],

        function renderCustomerTrackingView() {

            if (!activeOrder) {

            // Timeline status step configuration
            const steps = [
                { key: 'WAITING_PAYMENT', label: 'Pesanan Dibuat / Menunggu Bayar' },
                { key: 'PAID', label: 'Pembayaran Dikonfirmasi' },
                { key: 'WAITING_PRODUCTION', label: 'Menunggu Produksi' },

                { key: 'READY', label: 'Siap Diambil' },
                { key: 'COMPLETED', label: 'Selesai' }
            ];

            const getStepIndex = (status) => {
                const map = {
                    'WAITING_PAYMENT': 0,
                    'PAID': 1,
                    'WAITING_PRODUCTION': 2,
                    'IN_PROGRESS': 3,
                    'READY': 4,
                    'COMPLETED': 5
                };
                return map[status] ?? 0;
            };

            const currentIndex = getStepIndex(activeOrder.status);

            return `
                <div class="max-w-2xl mx-auto space-y-6">
                    <div class="flex justify-between items-center">
                        <h1 class="text-xl font-bold text-darkText">Tracking Live Pesanan</h1>

                const isDone = idx <= currentIndex;
                const isCurrent = idx === currentIndex;
                return `
                                    <div class="relative flex items-center gap-3">
                                        <div class="absolute -left-6 w-4 h-4 rounded-full flex items-center justify-center ${isDone ? 'bg-brand-600 text-white' : 'bg-stone-200 text-stone-400'}">

                                            ${s.label}

                                    </div>
                                `;
            }).join('')}
                        </div>

                        <!-- Item list preview -->
                        <div class="pt-4 border-t border-stone-100 space-y-2">
                            <h4 class="text-xs font-bold text-darkText">Rincian Item:</h4>
                            ${activeOrder.items.map(i => `
                                <div class="flex justify-between text-xs text-subtleText">
                                    <span>${i.name} x${i.qty}</span>
                                    <span class="font-semibold">${formatIDR(i.price * i.qty)}</span>
                                </div>
                            `).join('')}
                            <div class="flex justify-between text-sm font-bold text-darkText pt-2 border-t border-stone-100">
                                <span>Total</span>
                                <span class="text-brand-600">${formatIDR(activeOrder.total)}</span>
                            </div>

        // Custom HTML5 Canvas Chart Render
        function initSalesChart() {
            const canvas = document.getElementById('salesCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            // Handle DPI
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            const days = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
            const values = [3200000, 3850000, 4100000, 4500000, 4850000, 5200000, 4700000];

            const width = canvas.width;
            const height = canvas.height;
            const padding = 40;

            ctx.clearRect(0, 0, width, height);

            // Draw axes & bars
            const maxVal = Math.max(...values) * 1.2;
            const barWidth = (width - padding * 2) / days.length - 15;

            days.forEach((day, i) => {
                const x = padding + i * ((width - padding * 2) / days.length) + 10;
                const barHeight = (values[i] / maxVal) * (height - padding * 2);
                const y = height - padding - barHeight;

                // Gradient Bar
                const grad = ctx.createLinearGradient(0, y, 0, height - padding);
                grad.addColorStop(0, '#ea580c');
                grad.addColorStop(1, '#ffedd5');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.roundRect(x, y, barWidth, barHeight, 8);
                ctx.fill();

                // Labels
                ctx.fillStyle = '#78716C';
                ctx.font = '10px Plus Jakarta Sans';
                ctx.textAlign = 'center';
                ctx.fillText(day, x + barWidth / 2, height - 15);
            });
        }

        function startProduction(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (!order) return;

            // Check stock deduction via BOM
            let stockShortage = false;
            let shortageMsg = '';

            order.items.forEach(item => {
                const recipe = recipes.find(r => r.productId === item.id);
                if (recipe) {
                    recipe.ingredients.forEach(ingReq => {
                        const ing = ingredients.find(i => i.id === ingReq.ingredientId);
                        const totalReq = ingReq.qty * item.qty;
                        if (ing && ing.stock < totalReq) {
                            stockShortage = true;
                            shortageMsg += `${ing.name} kurang (${ing.stock} < ${totalReq} ${ing.unit}); `;
                        }
                    });
                }
            });

            if (stockShortage) {
                showToast(`Gagal: Stok bahan tidak mencukupi! ${shortageMsg}`, 'danger');
                return;
            }

            // Deduct stock
            order.items.forEach(item => {
                const recipe = recipes.find(r => r.productId === item.id);
                if (recipe) {
                    recipe.ingredients.forEach(ingReq => {
                        const ing = ingredients.find(i => i.id === ingReq.ingredientId);
                        const totalReq = ingReq.qty * item.qty;
                        if (ing) {
                            ing.stock -= totalReq;
                            inventoryTransactions.unshift({
                                id: inventoryTransactions.length + 1,
                                date: new Date().toLocaleString('id-ID'),
                                ingredientName: ing.name,
                                type: 'OUT',
                                qty: `${totalReq} ${ing.unit}`,
                                ref: `Production #${order.id}`,
                                user: state.currentUser.name
                            });
                        }
                    });
                }
            });

            order.status = 'IN_PROGRESS';
            logAudit('PRODUCTION', 'KDS', orderId, `Memulai produksi. Stok bahan baku dikurangi via BOM.`);
            showToast(`Produksi dimulai! Stok bahan otomatis berkurang.`, 'success');
            render();
        }

            const order = orders.find(o => o.id === orderId);
            if (order) {

                logAudit('PRODUCTION', 'KDS', orderId, `Selesai produksi. Status menjadi READY`);
                showToast(`Pesanan ${orderId} SIAP DIGUNAKAN / PICKUP!`, 'success');
                render();
            }
        }

                                    <th class="p-4">User</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-stone-100 text-xs">
                                ${inventoryTransactions.map(t => `
                                    <tr>
                                        <td class="p-4">${t.date}</td>
                                        <td class="p-4 font-bold">${t.ingredientName}</td>
                                        <td class="p-4">
                                            <span class="px-2 py-0.5 rounded font-bold text-[10px] ${t.type === 'IN' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${t.type}</span>
                                        </td>
                                        <td class="p-4 font-extrabold">${t.qty}</td>
                                        <td class="p-4 text-subtleText">${t.ref}</td>
                                        <td class="p-4">${t.user}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderSuppliersView() {
            return `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h1 class="text-xl font-bold text-darkText">Daftar Supplier</h1>
                        <button onclick="showToast('Modal Tambah Supplier Demo', 'info')" class="bg-brand-600 text-white font-bold px-4 py-2 rounded-xl text-xs">+ Tambah Supplier</button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        ${suppliers.map(s => `
                            <div class="bg-white border border-stone-200 p-5 rounded-3xl space-y-2 shadow-sm">
                                <div class="font-bold text-darkText text-base">${s.name}</div>
                                <div class="text-xs text-brand-600 font-semibold">${s.category}</div>
                                <div class="text-xs text-subtleText">${s.phone}</div>
                                <div class="text-xs text-stone-400">${s.address}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderPurchasingView() {
            return `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h1 class="text-xl font-bold text-darkText">Purchase Order (PO)</h1>
                        <button onclick="showToast('Buat Purchase Order Baru', 'info')" class="bg-brand-600 text-white font-bold px-4 py-2 rounded-xl text-xs">+ Buat PO Baru</button>
                    </div>

                    <div class="space-y-4">
                        ${purchases.map(po => `
                            <div class="bg-white rounded-3xl border border-stone-200 p-5 space-y-3 shadow-sm">
                                <div class="flex justify-between items-center border-b border-stone-100 pb-3">
                                    <div>
                                        <div class="font-extrabold text-darkText text-base">${po.id}</div>
                                        <div class="text-xs text-subtleText">${po.supplierName} • ${po.date}</div>
                                    </div>
                                    <span class="text-xs font-bold px-2.5 py-1 rounded-full ${po.status === 'Completed' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${po.status}</span>
                                </div>

                                <div class="space-y-1 text-xs">
                                    ${po.items.map(i => `
                                        <div class="flex justify-between text-subtleText">
                                            <span>${i.name} (${i.qty} ${i.unit})</span>
                                            <span>${formatIDR(i.price * i.qty)}</span>
                                        </div>
                                    `).join('')}
                                </div>

                                <div class="pt-3 border-t border-stone-100 flex justify-between items-center">
                                    <div class="font-extrabold text-brand-600 text-sm">${formatIDR(po.total)}</div>
                                    ${po.status === 'Ordered' ? `
                                        <button onclick="receivePurchase('${po.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-xl font-bold text-xs">
                                            Terima Barang (Auto Restock)
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function receivePurchase(poId) {
            const po = purchases.find(p => p.id === poId);
            if (!po) return;

            po.items.forEach(item => {
                const ing = ingredients.find(i => i.id === item.ingredientId);
                if (ing) {
                    ing.stock += item.qty;
                    inventoryTransactions.unshift({
                        id: inventoryTransactions.length + 1,
                        date: new Date().toLocaleString('id-ID'),
                        ingredientName: ing.name,
                        type: 'IN',
                        qty: `${item.qty} ${ing.unit}`,
                        ref: `Purchase #${po.id}`,
                        user: state.currentUser.name
                    });
                }
            });

            po.status = 'Completed';
            logAudit('RECEIVE', 'PO', poId, `Menerima barang PO. Stok bahan otomatis bertambah.`);
            showToast(`Barang PO ${poId} diterima! Stok bahan telah diperbarui.`, 'success');
            render();
        }

        function renderProductsView() {
            return `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h1 class="text-xl font-bold text-darkText">Kelola Produk Makanan</h1>
                        <button onclick="showToast('Tambah Produk Baru', 'info')" class="bg-brand-600 text-white font-bold px-4 py-2 rounded-xl text-xs">+ Tambah Produk</button>
                    </div>

                    <div class="bg-white rounded-3xl border border-stone-200 overflow-hidden shadow-sm">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-stone-50 border-b border-stone-200 text-xs font-bold text-subtleText">
                                    <th class="p-4">Produk</th>
                                    <th class="p-4">Kategori</th>
                                    <th class="p-4">Harga</th>
                                    <th class="p-4">Ketersediaan</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-stone-100 text-xs">
                                ${products.map(p => `
                                    <tr>
                                        <td class="p-4 font-bold text-darkText">${p.name}</td>
                                        <td class="p-4">${p.category}</td>
                                        <td class="p-4 font-bold text-brand-600">${formatIDR(p.price)}</td>
                                        <td class="p-4">
                                            <button onclick="toggleProductAvailability(${p.id})" class="px-2.5 py-1 rounded-full font-bold text-[10px] ${p.available ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                                                ${p.available ? 'Tersedia' : 'Habis'}
                                            </button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function toggleProductAvailability(id) {
            const p = products.find(prod => prod.id === id);
            if (p) {
                p.available = !p.available;
                showToast(`Status ${p.name} diubah menjadi ${p.available ? 'Tersedia' : 'Habis'}`, 'info');
                render();
            }
        }

        function renderUsersView() {
            return `
                <div class="space-y-6">
                    <h1 class="text-xl font-bold text-darkText">Manajemen User Sistem</h1>

                    <div class="bg-white rounded-3xl border border-stone-200 overflow-hidden shadow-sm">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-stone-50 border-b border-stone-200 text-xs font-bold text-subtleText">
                                    <th class="p-4">Nama</th>
                                    <th class="p-4">Email</th>
                                    <th class="p-4">Role</th>
                                    <th class="p-4">Last Login</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-stone-100 text-xs">
                                ${usersList.map(u => `
                                    <tr>
                                        <td class="p-4 font-bold text-darkText">${u.name}</td>
                                        <td class="p-4 text-subtleText">${u.email}</td>
                                        <td class="p-4"><span class="px-2 py-0.5 rounded font-bold text-[10px] bg-stone-100 text-stone-800">${u.role}</span></td>
                                        <td class="p-4 text-stone-400">${u.lastLogin}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderReportsView() {
            return `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h1 class="text-xl font-bold text-darkText">Laporan Keuangan & Penjualan</h1>
                        <button onclick="showToast('Ekspor CSV Mockup...', 'info')" class="bg-stone-800 text-white font-bold px-4 py-2 rounded-xl text-xs">Export CSV</button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-white p-5 rounded-3xl border border-stone-200 shadow-sm">
                            <div class="text-xs text-subtleText font-bold uppercase">Total Penjualan</div>
                            <div class="text-2xl font-black text-brand-600 mt-1">${formatIDR(18450000)}</div>
                        </div>
                        <div class="bg-white p-5 rounded-3xl border border-stone-200 shadow-sm">
                            <div class="text-xs text-subtleText font-bold uppercase">Total Order Selesai</div>
                            <div class="text-2xl font-black text-darkText mt-1">428 Order</div>
                        </div>
                        <div class="bg-white p-5 rounded-3xl border border-stone-200 shadow-sm">
                            <div class="text-xs text-subtleText font-bold uppercase">Rata-rata Order</div>
                            <div class="text-2xl font-black text-emerald-600 mt-1">${formatIDR(43100)}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAuditLogView() {
            return `
                <div class="space-y-6">
                    <h1 class="text-xl font-bold text-darkText">Audit Trail Log</h1>

                    <div class="bg-white rounded-3xl border border-stone-200 overflow-hidden shadow-sm">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-stone-50 border-b border-stone-200 text-xs font-bold text-subtleText">
                                    <th class="p-4">Timestamp</th>
                                    <th class="p-4">User</th>
                                    <th class="p-4">Action</th>
                                    <th class="p-4">Modul</th>
                                    <th class="p-4">Keterangan</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-stone-100 text-xs">
                                ${auditLogs.map(a => `
                                    <tr>
                                        <td class="p-4 text-stone-400">${a.timestamp}</td>
                                        <td class="p-4 font-bold text-darkText">${a.user}</td>
                                        <td class="p-4"><span class="px-2 py-0.5 rounded font-bold text-[10px] bg-brand-50 text-brand-700 border border-brand-200">${a.action}</span></td>
                                        <td class="p-4 text-subtleText">${a.module}</td>
                                        <td class="p-4">${a.desc}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // Toggle mobile drawer
        function toggleMobileSidebar() {
            showToast("Gunakan navigasi bawah / switcher role pada mobile", "info");
        }

        // 10. INITIALIZATION
        window.onload = function () {
            render();
        };
    </script>
</body>

</html>
