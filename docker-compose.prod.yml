services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: kantin-baraya-app:latest
    container_name: kantinbaraya_app
    restart: unless-stopped
    working_dir: /var/www/html
    mem_limit: 384m
    mem_reservation: 192m
    volumes:
      - storage_data:/var/www/html/storage
    env_file:
      - .env
    environment:
      HOME: /tmp
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE belum diisi}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME belum diisi}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD belum diisi}
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - laravel
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: kantin-baraya-web:latest
    container_name: kantinbaraya_nginx
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - storage_data:/var/www/html/storage:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    logging: *default-logging
    networks:
      - laravel
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: kantinbaraya_db
    restart: unless-stopped
    mem_limit: 384m
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-log-buffer-size=1M
      - --max-connections=30
      - --key-buffer-size=8M
      - --thread-stack=128K
      - --table-open-cache=200
      - --sort-buffer-size=256K
      - --read-buffer-size=128K
      - --read-rnd-buffer-size=256K
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD belum diisi}
    volumes:
      - db_data:/var/lib/mysql
    logging: *default-logging
    networks:
      - laravel
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  certbot:
    image: certbot/certbot
    profiles: ["certbot"]
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  db_data:
  storage_data:
  certbot_www: