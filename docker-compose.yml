services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: kantinbaraya_app
    restart: unless-stopped
    working_dir: /var/www/html

    # deploy.resources.limits HANYA berlaku di Swarm mode.
    # Untuk docker compose up biasa, pakai mem_limit/mem_reservation.
    mem_limit: 256m # jika di local direkomendasikan untuk dimatikan
    mem_reservation: 128m # jika di local direkomendasikan untuk dimatikan

    volumes:
    - .:/var/www/html
    - ./storage:/var/www/html/storage
    # - /var/www/html/public/build

    
    env_file:
      - .env

    environment:
      HOME: /tmp
      APP_ENV: local # untuk production ganti ke production
      APP_DEBUG: "true" # untuk production
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - laravel

    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: kantinbaraya_nginx
    restart: unless-stopped

    mem_limit: 64m

    ports:
      - "80:80"
     #- "443:443" # untuk production

    volumes:
      - ./docker/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
      # Nginx cukup butuh public/, bukan seluruh project (jangan expose .env & source code)
      - ./public:/var/www/html/public:ro 
      - ./storage:/var/www/html/storage:ro
      #- /etc/letsencrypt:/etc/letsencrypt:ro # untuk production

    networks:
      - laravel

    depends_on:
      app:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: kantinbaraya_db
    restart: unless-stopped

    #mem_limit: 384m # jika di local direkomendasikan untuk dimatikan

    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-log-buffer-size=1M
      - --max-connections=30
      - --key-buffer-size=8M
      - --thread-stack=128K
      - --table-open-cache=200
      - --sort-buffer-size=256K
      - --read-buffer-size=128K
      - --read-rnd-buffer-size=256K

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - db_data:/var/lib/mysql

    networks:
      - laravel

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 3


networks:
  laravel:
    driver: bridge


volumes:
  db_data:
  storage_data: