services:
  # Laravel PHP-FPM
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app

    container_name: kantinbaraya_app
    restart: unless-stopped
    working_dir: /var/www/html

    # Resource limit untuk development lokal
    mem_limit: 256m
    mem_reservation: 128m

    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage

    env_file:
      - .env

    environment:
      HOME: /tmp
      APP_ENV: local
      APP_DEBUG: "true"

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - laravel

    depends_on:
      db:
        condition: service_healthy

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: kantinbaraya_nginx
    restart: unless-stopped

    mem_limit: 64m

    ports:
      - "80:80"

    volumes:
      - ./docker/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - ./storage:/var/www/html/storage:ro

    networks:
      - laravel

    depends_on:
      app:
        condition: service_healthy

  # MySQL Database
  db:
    image: mysql:8.4
    container_name: kantinbaraya_db
    restart: unless-stopped

    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-log-buffer-size=1M
      - --max-connections=30
      - --key-buffer-size=8M
      - --thread-stack=128K
      - --table-open-cache=200
      - --sort-buffer-size=256K
      - --read-buffer-size=128K
      - --read-rnd-buffer-size=256K

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - db_data:/var/lib/mysql

    networks:
      - laravel

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  # Qdrant Vector Database untuk Coding Agent
  qdrant:
    image: qdrant/qdrant:latest
    container_name: kantinbaraya_qdrant
    restart: unless-stopped

    ports:
      - "127.0.0.1:6333:6333"

    volumes:
      - qdrant_storage:/qdrant/storage

    networks:
      - laravel

# Persistent storage
volumes:
  db_data:
  qdrant_storage:

# Network internal antar-container
networks:
  laravel:
    driver: bridge